<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2 配色修订 · 17 张对照预览</title>
<style>
body{font:16px/1.5 system-ui;margin:24px auto;padding:0 20px;max-width:1100px;background:#f5f5f2;color:#242b29}h1{font-size:28px;margin-bottom:8px}a{color:#176f62}
#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;margin:24px 0}
figure{margin:0;background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001}figcaption{padding:14px}strong{display:block;font-size:19px}small{color:#56635d}.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px}.panel{min-width:0}.panel p{margin:0;padding:6px 10px;font-size:14px;background:#eeeeea}.panel img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.pending{aspect-ratio:1;display:grid;place-items:center;background:#eceee9}.blue strong{color:#1266b6}.pink strong{color:#ac245c}.green strong{color:#17763a}
</style>
<h1>A2 配色修订 · 17 张对照预览</h1>
<p>左边是原图，右边是修订图。请检查：词义是否清楚、主体是否只有一种冠词色、背景与辅助物是否保持灰调。点击图片可放大。</p>
<p>der 蓝色 · die 红／粉色 · das 绿色。这批 17 张修订图已接入 App。<a href="../">打开 App</a><a href="a2-images-100.html">查看原 100 张预览</a></p>
<p id="status" role="status">加载中…</p><main id="gallery"></main>
<script>
fetch('../assets/vocab-images/a2-color-revisions-17.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw Error('图片清单加载失败');return response.json()}).then(plan=>{
 document.querySelector('#status').textContent=plan.items.filter(item=>item.generated).length+' / '+plan.items.length+' 张已修订';
 plan.items.forEach((item,index)=>{
  const figure=document.createElement('figure');figure.className=item.color;
  const caption=document.createElement('figcaption'),name=document.createElement('strong'),meaning=document.createElement('small');
  name.textContent=(index+1)+'. '+item.term;meaning.textContent=item.meaning+' · 原预览编号 '+item.originalNumber;caption.append(name,meaning);figure.append(caption);
  const pair=document.createElement('div');pair.className='pair';
  for(const [label,file,ready] of [['原图',item.originalFile,true],['修订图',item.file,item.generated]]){
   const panel=document.createElement('div');panel.className='panel';const labelText=document.createElement('p');labelText.textContent=label;panel.append(labelText);
   if(ready){const link=document.createElement('a');link.href='../assets/vocab-images/'+file;link.target='_blank';link.rel='noopener';const img=document.createElement('img');img.src=link.href;img.alt=item.term+' '+label;link.append(img);panel.append(link);}
   else{const pending=document.createElement('div');pending.className='pending';pending.textContent='处理中';panel.append(pending);}
   pair.append(panel);
  }
  figure.append(pair);document.querySelector('#gallery').append(figure);
 });
}).catch(error=>document.querySelector('#status').textContent=error.message);
</script>
</html>
