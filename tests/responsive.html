<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Responsive layout regression checks</title>
<style>body{font:16px system-ui;margin:24px}button{padding:12px}pre{white-space:pre-wrap}iframe{display:block;border:1px solid #ccc;margin-top:16px}</style>
<h1>Responsive layout regression checks</h1>
<p>Uses the real app templates and all wordbooks. Does not save learning progress or play audio. Desktop checks require all content to fit without scrolling; smaller screens must keep controls visible and avoid horizontal overflow.</p>
<button id="run">Run layout checks</button>
<pre id="results" role="status">Ready</pre>
<iframe title="App under test"></iframe>
<script>
const sizes = [[1920,1080],[1440,900],[1366,768],[1280,720],[1024,768],[1280,600],[844,390],[768,1024],[390,844],[320,568]];
const params = new URLSearchParams(location.search);
const limit = Number(params.get('limit')) || 0;
const frame = document.querySelector('iframe');
const output = document.querySelector('#results');
const run = document.querySelector('#run');
const bridge = `
window.layoutQA = {
  language(value) { setLanguage(value); },
  load(text, manifest, translations) { CHINESE_VOCABULARY = translations; IMAGE_PATHS = parseImageManifest(manifest); WORDS = parseVocabulary(text); return WORDS; },
  setup(books) { WORDBOOKS = books; syncWordbookPicker(); document.body.classList.remove('is-studying'); setupView.classList.remove('hidden'); studyView.classList.add('hidden'); },
  study(word, view) {
    document.body.classList.add('is-studying'); setupView.classList.add('hidden'); studyView.classList.remove('hidden');
    card.className = 'word-card neutral'; cardStack.className = 'card-stack neutral'; nextCardPreview.classList.add('is-empty');
    setText(feedback, ''); actions.innerHTML = ''; currentItem = {word, phase: 'quiz'};
    if (view === 'learn' || view === 'missed') {
      setText(modePill, 'Learn'); renderLearn(word, {autoSpeak: false, ...(view === 'missed' ? {actionsHtml: '<button class="answer-button">Back to question</button><button class="answer-button primary">Continue</button>'} : {})});
    } else if (view === 'meaning') { renderMeaningQuiz(word); }
    else if (view === 'article') { renderArticleQuiz(word); }
    else if (view === 'fill') { renderFillQuiz(word); }
    else if (view === 'done') { renderDone(); }
    if (view === 'missed') setText(feedback, 'Continue');
  }
};`;
run.onclick = async () => {
 run.disabled = true;
 try {
  const [html, source, manifest, allBooks, translations] = await Promise.all([
   fetch('../index.html',{cache:'no-store'}).then(r=>r.text()), fetch('../app.js',{cache:'no-store'}).then(r=>r.text()),
   fetch('../assets/vocab-images/manifest.json',{cache:'no-store'}).then(r=>r.json()), fetch('../wordbooks/manifest.json',{cache:'no-store'}).then(r=>r.json()),fetch('../wordbooks/zh-CN.json',{cache:'no-store'}).then(r=>r.json())
  ]);
  const books = allBooks.filter(book => !params.get('book') || book.id === params.get('book'));
  const texts = await Promise.all(books.map(b=>fetch('../'+b.url).then(r=>r.text())));
  // Omit startup side effects, including progress storage, in this isolated test document.
  const testSource = source.replace(/let state = loadState\(\);/, 'let state = createDefaultState();')
    .replace(/\blocalStorage\b/g, 'window.testStorage')
    .replace(/loadVoices\(\);\s*syncCountPicker\(\);\s*loadVocabulary\(\);\s*$/, 'syncCountPicker();');
  const loaded = new Promise(resolve => frame.onload = resolve);
  frame.srcdoc = html.replace('<head>', '<head><base href="'+new URL('../',location.href).href+'">')
   .replace(/<script src="app\.js[^\"]*"><\/script>/, () => '<script>window.testStorage={getItem:()=>null,setItem:()=>{}};'+testSource+'\n'+bridge+'<\/script>');
  await loaded;
  const qa = frame.contentWindow.layoutQA;
  const doc = frame.contentDocument;
  const failures = [];
  const rows = [];
  let checks = 0;
  const check = (label, desktop, study) => {
    checks++;
    const root = doc.documentElement;
    const content = doc.querySelector('#cardContent');
    const width = frame.contentWindow.innerWidth;
    const height = frame.contentWindow.innerHeight;
    const issues = [];
    const languageControl = doc.querySelector('#languageSwitcher').getBoundingClientRect();
    if (languageControl.width < 1 || languageControl.top < 0 || languageControl.right > width + 1 || languageControl.bottom > height) issues.push('language switcher outside viewport');
    if (root.scrollWidth > width + 1) issues.push('page horizontal overflow');
    if (root.scrollHeight > height + 1 && (desktop || study)) issues.push('page vertical overflow');
    if (study) {
      if (content.clientHeight < 40) issues.push('content too short');
      if (content.scrollWidth > content.clientWidth + 1) issues.push('content horizontal overflow');
      if (desktop && content.scrollHeight > content.clientHeight + 1) issues.push('content needs scrolling ('+content.scrollHeight+'/'+content.clientHeight+')');
      const controls = [...doc.querySelectorAll('#actions button, .session-strip button')];
      if (controls.some(el=>el.getBoundingClientRect().bottom > height + 1)) issues.push('controls below viewport');
    }
    if (issues.length) failures.push({label,issues});
  };
  for (const language of ['en','zh']) {
  for (const [width,height] of sizes) {
    frame.width = width; frame.height = height;
    await new Promise(requestAnimationFrame);
    const before = failures.length;
    qa.language(language);
    qa.setup(books);
    check(language+' '+width+'x'+height+' setup',width>=961,false);
    for (let book=0;book<books.length;book++) {
      const words = qa.load(texts[book],manifest,translations);
      // Exercise every learning card and missed-card state, then all review formats for long entries.
      const longest = [...words].sort((a,b)=>(b.word.length+b.example.length)-(a.word.length+a.example.length));
      const sample = width >= 961 ? (limit ? longest.slice(0,limit) : words) : longest.slice(0,language === 'zh' ? 30 : 8);
      for (const word of sample) {
        for (const view of ['learn','missed']) {
          qa.study(word,view);
          check(language+' '+width+'x'+height+' '+books[book].id+' '+word.word+' '+view,width>=961,true);
        }
        // Yield during large wordbooks so the results page remains responsive.
        if (checks % 100 < 2) await new Promise(requestAnimationFrame);
      }
      for (const word of [...words].sort((a,b)=>b.word.length-a.word.length).slice(0,5)) {
        for (const view of ['meaning','article','fill','done']) {
          qa.study(word,view);
          check(language+' '+width+'x'+height+' '+word.word+' '+view,width>=961,true);
        }
      }
    }
    rows.push(language+' '+width+'x'+height+': '+(failures.length-before)+' failures');
    output.textContent = rows.join('\n')+'\n'+checks+' checks so far';
    await new Promise(requestAnimationFrame);
  }
  }
  output.textContent = rows.join('\n')+'\n'+checks+' checks; '+failures.length+' failures\n'+JSON.stringify(failures.slice(0,30),null,2);
 } catch(error) { output.textContent = error.stack; }
 run.disabled = false;
};
</script>
</html>
